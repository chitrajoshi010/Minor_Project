[platformio]
default_envs = gateway

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.4

; Build one of the three roles:
;   pio run -e gateway && pio upload -e gateway
;   pio run -e relay && pio upload -e relay
;   pio run -e node && pio upload -e node

; Board mapping (see README.md):
;   gateway = ESP32-WROOM-32              (board esp32dev)
;   relay   = ESP32-S3-N8R2               (esp32-s3-devkitc-1, 8 MB flash, 2 MB quad PSRAM)
;   node    = ESP32-S3-N16R8              (esp32-s3-devkitc-1, 16 MB flash, 8 MB octal PSRAM)

[env:gateway]
board = esp32dev
; Gateway = ESP32-WROOM-32 devkit: GPIO16/17 not broken out, so override the
; S3 defaults for MOSI/MISO/DIO1 (see LdseConfig.h).
build_flags =
    -DLDSE_ROLE=0
    -DLDSE_PIN_MOSI=23
    -DLDSE_PIN_MISO=19
    -DLDSE_PIN_DIO1=26

[env:relay]
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_build.psram_type = qspi
build_flags =
    -DLDSE_ROLE=1
    -DBOARD_HAS_PSRAM

[env:node]
board = esp32-s3-devkitc-1
; NOTE: 16MB flash_size + default_16MB.csv crash the bootloader on this board
; (bootloader_sha image-verify panic). The flash chip is physically 16MB but
; we use the 8MB layout, which is more than enough for the ~320 KB app.
; PSRAM is not used yet; enabling it (psram_type=opi) only emits a harmless
; "PSRAM ID read error" at boot on this module.
board_build.flash_size = 8MB
build_flags =
    -DLDSE_ROLE=2
